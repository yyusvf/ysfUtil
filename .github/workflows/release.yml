name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ysfUtil.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -cne "v$version") {
            throw "Tag must match project version v$version"
          }
      - name: Test
        run: dotnet run --project Tests/ShutdownTimer.Tests.csproj -c Release
      - name: Publish portable app
        run: dotnet publish ysfUtil.csproj -c Release -o release -p:DebugType=None -p:DebugSymbols=false
      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' release/ysfUtil.exe release/THIRD-PARTY-NOTICES.txt --verify-tag --generate-notes --title 'ysfUtil ${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ysfUtil-portable
          path: release/*
